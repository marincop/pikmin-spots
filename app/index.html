<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#eef4ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="皮克敏純點">
<title>皮克敏純點地圖</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
:root{--bg:#eef4ec;--panel:rgba(255,255,255,.97);--panel2:#ffffff;--line:#cfe0cc;--fg:#16261a;--dim:#5f7a66;--accent:#0f7a3c;--accent-ink:#fff;--warn:#b35c00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif}
#map{position:absolute;inset:0;height:100%;z-index:1}
.panel{position:absolute;left:0;right:0;z-index:20;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
#top{top:0;padding-top:calc(8px + env(safe-area-inset-top));background:linear-gradient(var(--panel) 60%,transparent)}
#bottom{bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--panel) 40%)}
input,select,button{font:inherit;font-size:15px;color:var(--fg);background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;width:100%}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
button{cursor:pointer}
[hidden]{display:none!important}
.row{display:flex;gap:8px}
.row>*{flex:1}
.icon-btn{display:grid;place-items:center;font-size:17px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);
  font-size:14.5px;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
#nearby,#spot{display:none;position:absolute;left:0;right:0;bottom:0;z-index:40;background:var(--panel);
  border-top:1px solid var(--line);max-height:70%;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
#nearby.on,#spot.on{display:block}
#nearby h3,#spot h3{margin:0 0 10px;font-size:16.5px}
#nearbyList{display:flex;flex-direction:column;gap:6px}
.nrow{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:12px 13px;
  border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:15.5px;text-align:left;width:100%}
.nrow .nm{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.nrow .sub{color:var(--dim);font-size:13px}
.nrow .d{color:var(--accent);font-weight:700;flex:0 0 auto;font-size:15px}
#me{width:16px;height:16px;border-radius:50%;background:#3b82f6;border:3px solid #fff;
  box-shadow:0 0 0 2px rgba(59,130,246,.45),0 0 8px rgba(0,0,0,.5)}
#stats{font-size:13.5px;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
#stats b{color:var(--accent)}
.pop{font-size:15.5px;line-height:1.6}
.pop b{color:var(--accent);font-size:16px}
.pop a{color:#0b6ea8;text-decoration:none;border-bottom:1px solid rgba(11,110,168,.35)}
.pop .c{font-family:ui-monospace,monospace;font-size:13px;color:var(--dim)}
.pop a.navbtn{display:inline-block;padding:10px 16px;border-radius:10px;background:var(--accent);
  color:var(--accent-ink);font-weight:700;font-size:15.5px;text-decoration:none;line-height:1.2;border:0}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel2);color:var(--fg)}
.leaflet-popup-content{margin:10px 12px}
.mk{filter:drop-shadow(0 0 2px rgba(0,0,0,.45))}
.visited{opacity:.5}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:60;background:#fff;
  border:1.5px solid var(--accent);color:#0f5c2f;padding:9px 16px;border-radius:999px;font-size:14.5px;
  max-width:90vw;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.12);font-weight:600;
  opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#toast.err{background:#fff2f2;border-color:#d33;color:#a11}
.sheetclose{color:var(--dim);text-align:center;font-size:14.5px;padding:12px}
</style>
</head>
<body>
<div id="map"></div>

<div class="panel" id="top">
  <div class="row">
    <select id="decor" aria-label="步驟一：飾品類型"><option value="">① 飾品類型：全部</option></select>
  </div>
  <div class="row">
    <select id="place" aria-label="步驟二：地點">
      <option value="">② 地點：🌏 全部</option>
      <option value="__near__">② 地點：📍 我附近（用定位）</option>
    </select>
    <select id="county" aria-label="選擇縣市" hidden><option value="">全部縣市</option></select>
  </div>
  <div class="row">
    <button class="icon-btn" id="relocate" hidden>🔄 重新定位</button>
    <button class="icon-btn" id="install" hidden>⬇️ 安裝 App</button>
  </div>
</div>

<div class="panel" id="bottom">
  <div id="stats">
    <span>顯示 <b id="shown">0</b> / <span id="total">0</span> 個純點</span>
    <span><span id="visitedCount">0</span> 個已踩</span>
  </div>
  <div class="row">
    <button id="btnSort">↕️ 排序：距離</button>
    <button id="btnReset">♻️ 重設</button>
    <button id="btnCand">🔍 待確認：關</button>
  </div>
</div>

<div id="nearby">
  <h3>📍 你附近的純點 <span id="nearbyCount" style="color:var(--dim);font-weight:400;font-size:12px"></span></h3>
  <div id="nearbyList"></div>
  <div class="sheetclose" id="nearbyClose">關閉</div>
</div>

<div id="spot">
  <h3>純點資訊</h3>
  <div id="spotBody" class="pop"></div>
  <div class="sheetclose" id="spotClose">關閉</div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<!-- ?v= 用來繞過 Cloudflare 對 .js 的 4h 快取；每次改版請 +1 -->
<script src="data/spots.js?v=8"></script>
<script src="app.js?v=11"></script>
</body>
</html>
